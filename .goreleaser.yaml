version: 2

project_name: formic

before:
  hooks:
    # Pre-warms the module cache before the build.
    - go mod download

builds:
  - main: ./cmd/formic
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.CommitDate}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  mode: keep-existing
  replace_existing_artifacts: true

brews:
  - name: formic
    repository:
      owner: hive-controls
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/hive-controls/formic
    description: formic is a terminal launcher and monitor for the tools that live in a repository.
    license: MIT
    install: |
      bin.install "formic"
    test: |
      system "#{bin}/formic", "version"
